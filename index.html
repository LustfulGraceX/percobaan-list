<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color"
        content="#111725">

  <title>Video Links</title>


  <style>

    /* =========================================================
       VIDEO LINKS - MOBILE FOCUSED
       GITHUB PAGES
       ========================================================= */


    /* =========================================================
       GLOBAL RESET
       ========================================================= */

    * {
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;

      background: #111725;
    }


    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #ffffff;
    }


    /* =========================================================
       MAIN PAGE
       ========================================================= */

    .vl-page {

      width: 100%;
      min-height: 100vh;

      display: flex;
      justify-content: center;

      padding:
        24px
        12px;

      background:

        radial-gradient(
          circle at 50% 10%,
          rgba(92,111,255,.08),
          transparent 38%
        ),

        #111725;
    }


    /* =========================================================
       MAIN WRAPPER
       ========================================================= */

    .vl-wrapper {

      width: 100%;

      max-width: 680px;

      margin: 0 auto;
    }


    /* =========================================================
       IMAGE
       ========================================================= */

    .vl-image-box {

      position: relative;

      width: 60%;

      max-width: 360px;

      margin:
        0 auto
        20px auto;

      overflow: hidden;

      border-radius: 14px;

      background: #1f2533;

      border:
        1px solid
        #3a4353;

      box-shadow:
        0 10px 30px
        rgba(0,0,0,.22);
    }


    .vl-image {

      display: block;

      width: 100%;
      height: auto;

      margin: 0;
      padding: 0;

      object-fit: contain;
    }


    /* =========================================================
       IMAGE OVERLAY
       ========================================================= */

    .vl-image-box::after {

      content: "";

      position: absolute;

      inset: 0;

      pointer-events: none;

      background:

        linear-gradient(
          to bottom,
          transparent 65%,
          rgba(17,23,37,.12)
        );
    }


    /* =========================================================
       HEADER
       ========================================================= */

    .vl-header {

      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin:
        0 0
        12px 0;

      padding:
        0 3px;
    }


    /* =========================================================
       TITLE
       ========================================================= */

    .vl-title {

      display: flex;

      align-items: center;

      gap: 8px;

      color: #c0c7d5;

      font-size: 15px;

      font-weight: 700;

      letter-spacing: .8px;

      line-height: 20px;
    }


    .vl-title::before {

      content: "";

      width: 7px;
      height: 7px;

      flex:
        0 0 7px;

      background: #5c6fff;

      border-radius: 50%;

      box-shadow:
        0 0 9px
        rgba(92,111,255,.65);
    }


    /* =========================================================
       LINK COUNTER
       ========================================================= */

    .vl-count {

      color: #8d97aa;

      font-size: 12px;

      font-weight: 600;

      letter-spacing: .2px;

      white-space: nowrap;
    }


    .vl-count-dot {

      color: #48d597;

      margin-right: 4px;

      text-shadow:
        0 0 7px
        rgba(72,213,151,.6);
    }


    /* =========================================================
       CARD
       ========================================================= */

    .vl-card {

      position: relative;

      display: flex;

      align-items: center;

      width: 100%;

      min-height: 82px;

      margin:
        0 0
        11px 0;

      padding:
        11px
        13px
        11px
        14px;

      background: #1f2533;

      border:
        1px solid
        #3a4353;

      border-radius: 15px;

      color: #ffffff;

      text-decoration: none;

      overflow: hidden;

      transition:
        transform .18s ease,
        background .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;
    }


    /* =========================================================
       CARD HOVER
       ========================================================= */

    .vl-card:hover {

      transform:
        translateY(-2px);

      background: #252c3a;

      border-color: #4a5568;
    }


    .vl-card:active {

      transform:
        translateY(0);
    }


    /* =========================================================
       LEFT COLOR LINE
       ========================================================= */

    .vl-card.red {

      border-left:
        4px solid
        #e91e45;
    }


    .vl-card.blue {

      border-left:
        4px solid
        #4169e1;
    }


    .vl-card.purple {

      border-left:
        4px solid
        #8b3dff;
    }


    /* =========================================================
       HOVER GLOW
       ========================================================= */

    .vl-card.red:hover {

      box-shadow:
        0 8px 25px
        rgba(233,30,69,.12);
    }


    .vl-card.blue:hover {

      box-shadow:
        0 8px 25px
        rgba(65,105,225,.12);
    }


    .vl-card.purple:hover {

      box-shadow:
        0 8px 25px
        rgba(139,61,255,.12);
    }


    /* =========================================================
       MAIN SHIMMER
       ========================================================= */

    .vl-card.main-link::after {

      content: "";

      position: absolute;

      top: 0;
      left: -120%;

      width: 70%;
      height: 100%;

      background:

        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.035),
          transparent
        );

      transform:
        skewX(-18deg);

      animation:
        vl-shimmer
        5s ease-in-out infinite;

      pointer-events: none;
    }


    @keyframes vl-shimmer {

      0% {
        left: -120%;
      }

      35% {
        left: 140%;
      }

      100% {
        left: 140%;
      }

    }


    /* =========================================================
       ICON
       ========================================================= */

    .vl-icon {

      position: relative;

      z-index: 2;

      flex:
        0 0 42px;

      width: 42px;
      height: 42px;

      display: flex;

      align-items: center;
      justify-content: center;

      margin-right: 12px;

      background: #303747;

      border-radius: 11px;

      color: #ffffff;

      font-size: 17px;

      line-height: 1;

      transition:
        transform .18s ease,
        background .18s ease,
        box-shadow .18s ease;
    }


    .vl-icon.play {

      padding-left: 2px;
    }


    .vl-icon.alt {

      font-size: 18px;
    }


    /* =========================================================
       ICON HOVER
       ========================================================= */

    .vl-card:hover .vl-icon {

      transform:
        scale(1.06);

      background: #363e50;
    }


    .vl-card.red:hover .vl-icon {

      box-shadow:
        0 0 15px
        rgba(233,30,69,.16);
    }


    .vl-card.blue:hover .vl-icon {

      box-shadow:
        0 0 15px
        rgba(65,105,225,.16);
    }


    .vl-card.purple:hover .vl-icon {

      box-shadow:
        0 0 15px
        rgba(139,61,255,.16);
    }


    /* =========================================================
       CONTENT
       ========================================================= */

    .vl-content {

      position: relative;

      z-index: 2;

      flex:
        1 1 auto;

      min-width: 0;

      overflow: hidden;
    }


    /* =========================================================
       NAME ROW
       ========================================================= */

    .vl-name-row {

      display: flex;

      align-items: center;

      min-width: 0;

      margin:
        0 0
        3px 0;
    }


    /* =========================================================
       NAME
       ========================================================= */

    .vl-name {

      display: block;

      min-width: 0;

      color: #ffffff;

      font-size: 17px;

      font-weight: 700;

      line-height: 21px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    /* =========================================================
       BADGE
       ========================================================= */

    .vl-badge {

      flex:
        0 0 auto;

      margin-left: 7px;

      padding:
        3px
        6px;

      border-radius: 6px;

      font-size: 9px;

      font-weight: 800;

      letter-spacing: .5px;

      line-height: 12px;
    }


    /* =========================================================
       MAIN BADGE
       ========================================================= */

    .main-badge {

      color: #65e6a5;

      background:
        rgba(72,213,151,.12);

      border:
        1px solid
        rgba(72,213,151,.28);
    }


    /* =========================================================
       UNAVAILABLE BADGE
       ========================================================= */

    .unavailable-badge {

      color: #ff7183;

      background:
        rgba(233,30,69,.10);

      border:
        1px solid
        rgba(233,30,69,.24);
    }


    /* =========================================================
       DESCRIPTION
       ========================================================= */

    .vl-description {

      display: block;

      color: #b3bbca;

      font-size: 13px;

      font-weight: 400;

      line-height: 18px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    /* =========================================================
       STATUS
       ========================================================= */

    .vl-status {

      display: flex;

      align-items: center;

      margin-top: 3px;

      color: #7f899d;

      font-size: 11px;

      line-height: 14px;
    }


    /* =========================================================
       STATUS DOT
       ========================================================= */

    .vl-status-dot {

      width: 5px;
      height: 5px;

      flex:
        0 0 5px;

      margin-right: 5px;

      background: #48d597;

      border-radius: 50%;

      box-shadow:
        0 0 7px
        rgba(72,213,151,.55);
    }


    /* =========================================================
       UNAVAILABLE
       ========================================================= */

    .vl-card.unavailable .vl-status {

      color: #ed6678;
    }


    .vl-card.unavailable .vl-status-dot {

      background: #e91e45;

      box-shadow:
        0 0 7px
        rgba(233,30,69,.55);

      animation:
        vl-unavailable-pulse
        2s ease-in-out infinite;
    }


    @keyframes vl-unavailable-pulse {

      0%,
      100% {

        opacity: .65;

        box-shadow:
          0 0 5px
          rgba(233,30,69,.35);
      }

      50% {

        opacity: 1;

        box-shadow:
          0 0 9px
          rgba(233,30,69,.65);
      }

    }


    /* =========================================================
       ARROW
       ========================================================= */

    .vl-arrow {

      position: relative;

      z-index: 2;

      flex:
        0 0 auto;

      margin-left: 8px;

      color: #8d96a8;

      font-size: 28px;

      font-weight: 300;

      line-height: 1;

      transition:
        transform .18s ease,
        color .18s ease;
    }


    .vl-card:hover .vl-arrow {

      transform:
        translateX(4px);

      color: #ffffff;
    }


    /* =========================================================
       FOOTER
       ========================================================= */

    .vl-footer {

      margin-top: 17px;

      text-align: center;

      color: #69758a;

      font-size: 11px;

      line-height: 17px;

      letter-spacing: .2px;
    }


    /* =========================================================
       RESPONSIVE IMAGE
       
       Tidak menggunakan breakpoint tablet/mobile.
       Ukuran gambar mengikuti lebar layar.
       ========================================================= */

    @media (max-width: 680px) {

      .vl-image-box {

        width: 58%;

        max-width: 300px;
      }

    }


    @media (max-width: 420px) {

      .vl-page {

        padding:
          20px
          10px;
      }


      .vl-image-box {

        width: 58%;

        max-width: 240px;

        margin-bottom: 18px;

        border-radius: 13px;
      }


      .vl-header {

        margin-bottom: 11px;
      }


      .vl-title {

        font-size: 14px;
      }


      .vl-count {

        font-size: 11px;
      }


      .vl-card {

        min-height: 80px;

        padding:
          10px
          11px
          10px
          12px;

        border-radius: 14px;
      }


      .vl-icon {

        flex-basis: 41px;

        width: 41px;
        height: 41px;

        margin-right: 11px;

        border-radius: 10px;

        font-size: 16px;
      }


      .vl-name {

        font-size: 16px;

        line-height: 20px;
      }


      .vl-description {

        font-size: 12px;

        line-height: 17px;
      }


      .vl-status {

        font-size: 10px;

        line-height: 14px;
      }


      .vl-arrow {

        font-size: 27px;

        margin-left: 6px;
      }

    }


    /* =========================================================
       VERY SMALL SCREEN
       ========================================================= */

    @media (max-width: 340px) {

      .vl-image-box {

        width: 55%;

        max-width: 200px;
      }


      .vl-name {

        font-size: 15px;
      }


      .vl-description {

        font-size: 11px;
      }

    }


    /* =========================================================
       REDUCED MOTION
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      .vl-card,
      .vl-icon,
      .vl-arrow {

        transition: none;
      }


      .vl-card.main-link::after,
      .vl-card.unavailable .vl-status-dot {

        animation: none;
      }

    }

  </style>

</head>


<body>


  <!-- =======================================================
       MAIN PAGE
       ======================================================= -->

  <main class="vl-page">


    <div class="vl-wrapper">


      <!-- =====================================================
           IMAGE / POSTER

           GANTI LINK GAMBAR DI src
           ===================================================== -->

      <div class="vl-image-box">

        <img
          class="vl-image"
          src="https://cdn.aceimg.com/PSqYXQOti.png"
          alt="Video Preview"
          loading="eager"
        >

      </div>


      <!-- =====================================================
           HEADER
           ===================================================== -->

      <header class="vl-header">

        <div class="vl-title">
          VIDEO LINKS
        </div>


        <div class="vl-count">

          <span class="vl-count-dot">
            ●
          </span>

          2 LINKS AVAILABLE

        </div>

      </header>


      <!-- =====================================================
           VIDEO 1 - MAIN

           GANTI LINK DI href
           ===================================================== -->

      <a
        class="vl-card red main-link"
        href="https://example.com/video1"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="vl-icon play">
          ▶
        </span>


        <span class="vl-content">


          <span class="vl-name-row">

            <span class="vl-name">
              Video 1
            </span>


            <span class="vl-badge main-badge">
              MAIN
            </span>

          </span>


          <span class="vl-description">
            Open the main video link
          </span>


          <span class="vl-status">

            <span class="vl-status-dot"></span>

            Available

          </span>


        </span>


        <span class="vl-arrow">
          ›
        </span>

      </a>


      <!-- =====================================================
           VIDEO 2 - UNAVAILABLE

           TETAP BISA DIKLIK
           ===================================================== -->

      <a
        class="vl-card blue unavailable"
        href="https://example.com/video2"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="vl-icon play">
          ▶
        </span>


        <span class="vl-content">


          <span class="vl-name-row">

            <span class="vl-name">
              Video 2
            </span>


            <span class="vl-badge unavailable-badge">
              UNAVAILABLE
            </span>

          </span>


          <span class="vl-description">
            This video is currently unavailable
          </span>


          <span class="vl-status">

            <span class="vl-status-dot"></span>

            Unavailable

          </span>


        </span>


        <span class="vl-arrow">
          ›
        </span>

      </a>


      <!-- =====================================================
           ALTERNATIVE LINK

           GANTI LINK DI href
           ===================================================== -->

      <a
        class="vl-card purple"
        href="https://example.com/alternative"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="vl-icon alt">
          🎬
        </span>


        <span class="vl-content">


          <span class="vl-name-row">

            <span class="vl-name">
              Alternative Link
            </span>

          </span>


          <span class="vl-description">
            Use this if the main links are unavailable
          </span>


          <span class="vl-status">

            <span class="vl-status-dot"></span>

            Backup Available

          </span>


        </span>


        <span class="vl-arrow">
          ›
        </span>

      </a>


      <!-- =====================================================
           FOOTER
           ===================================================== -->

      <div class="vl-footer">

        Select a video link above

      </div>


    </div>

  </main>


</body>
</html>
