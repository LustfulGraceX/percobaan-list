<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#111725"
  >

  <title>Video Links</title>


  <style>

    /* =========================================================
       VIDEO LINKS - GITHUB PAGES
       MOBILE-FOCUSED / FULL RESPONSIVE
       ========================================================= */


    /* =========================================================
       GLOBAL RESET
       ========================================================= */

    * {
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      min-height: 100%;

      margin: 0;
      padding: 0;

      background: #111725;
    }


    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #ffffff;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }


    /* =========================================================
       PAGE
       ========================================================= */

    .vl-page {

      width: 100%;
      min-height: 100vh;

      display: flex;

      align-items: center;
      justify-content: center;

      padding:
        clamp(18px, 4vw, 35px)
        clamp(10px, 4vw, 25px);

      background:

        radial-gradient(
          circle at 50% 12%,
          rgba(92,111,255,.09),
          transparent 38%
        ),

        #111725;
    }


    /* =========================================================
       MAIN WRAPPER
       ========================================================= */

    .vl-wrapper {

      width: 100%;

      max-width: 680px;

      margin: 0 auto;
    }


    /* =========================================================
       IMAGE / POSTER
       ========================================================= */

    .vl-image-box {

      position: relative;

      /*
       * Mobile focused:
       * gambar tidak memenuhi lebar layar.
       */

      width: min(88%, 350px);

      margin:
        0 auto
        clamp(16px, 4vw, 22px);

      overflow: hidden;

      border-radius:
        clamp(12px, 2.5vw, 18px);

      background: #1f2533;

      border:
        1px solid
        #3a4353;

      box-shadow:
        0 12px 35px
        rgba(0,0,0,.22);
    }


    .vl-image {

      display: block;

      width: 100%;
      height: auto;

      margin: 0;
      padding: 0;

      object-fit: contain;
    }


    /* =========================================================
       IMAGE OVERLAY
       ========================================================= */

    .vl-image-box::after {

      content: "";

      position: absolute;

      inset: 0;

      pointer-events: none;

      background:

        linear-gradient(
          to bottom,
          transparent 68%,
          rgba(17,23,37,.10)
        );
    }


    /* =========================================================
       HEADER
       ========================================================= */

    .vl-header {

      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 12px;

      width: 100%;

      margin:
        0 0
        clamp(10px, 2.5vw, 13px);

      padding:
        0 3px;
    }


    /* =========================================================
       TITLE
       ========================================================= */

    .vl-title {

      display: flex;

      align-items: center;

      gap: 8px;

      min-width: 0;

      color: #b7bece;

      /*
       * Lebih besar dari versi sebelumnya
       */

      font-size:
        clamp(13px, 3.4vw, 15px);

      font-weight: 700;

      letter-spacing:
        clamp(.7px, .2vw, 1px);

      line-height: 20px;
    }


    .vl-title::before {

      content: "";

      width: 7px;
      height: 7px;

      flex:
        0 0 7px;

      background: #5c6fff;

      border-radius: 50%;

      box-shadow:
        0 0 9px
        rgba(92,111,255,.60);
    }


    /* =========================================================
       LINK COUNTER
       ========================================================= */

    .vl-count {

      flex:
        0 0 auto;

      color: #8993a7;

      font-size:
        clamp(10px, 2.6vw, 12px);

      font-weight: 600;

      letter-spacing: .25px;

      white-space: nowrap;
    }


    .vl-count-dot {

      color: #48d597;

      margin-right: 4px;

      text-shadow:
        0 0 8px
        rgba(72,213,151,.65);
    }


    /* =========================================================
       CARD
       ========================================================= */

    .vl-card {

      position: relative;

      display: flex;

      align-items: center;

      width: 100%;

      /*
       * Card lebih tinggi supaya nyaman disentuh
       */

      min-height:
        clamp(76px, 18vw, 88px);

      margin:
        0 0
        clamp(10px, 2.5vw, 13px);

      padding:
        clamp(10px, 2.5vw, 13px)
        clamp(12px, 3.5vw, 18px)
        clamp(10px, 2.5vw, 13px)
        clamp(13px, 3.8vw, 20px);

      background: #1f2533;

      border:
        1px solid
        #3a4353;

      border-radius:
        clamp(13px, 3vw, 17px);

      color: #ffffff;

      text-decoration: none;

      overflow: hidden;

      -webkit-tap-highlight-color:
        transparent;

      transition:
        transform .18s ease,
        background .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;
    }


    /* =========================================================
       HOVER
       ========================================================= */

    .vl-card:hover {

      transform:
        translateY(-2px);

      background: #252c3a;

      border-color: #4a5568;
    }


    .vl-card:active {

      transform:
        scale(.99);
    }


    /* =========================================================
       COLOR LINE
       ========================================================= */

    .vl-card.red {

      border-left:
        4px solid
        #e91e45;
    }


    .vl-card.blue {

      border-left:
        4px solid
        #4169e1;
    }


    .vl-card.purple {

      border-left:
        4px solid
        #8b3dff;
    }


    /* =========================================================
       HOVER GLOW
       ========================================================= */

    .vl-card.red:hover {

      box-shadow:
        0 8px 28px
        rgba(233,30,69,.12);
    }


    .vl-card.blue:hover {

      box-shadow:
        0 8px 28px
        rgba(65,105,225,.12);
    }


    .vl-card.purple:hover {

      box-shadow:
        0 8px 28px
        rgba(139,61,255,.12);
    }


    /* =========================================================
       MAIN SHIMMER
       ========================================================= */

    .vl-card.main-link::after {

      content: "";

      position: absolute;

      top: 0;
      left: -120%;

      width: 70%;
      height: 100%;

      background:

        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.035),
          transparent
        );

      transform:
        skewX(-18deg);

      animation:
        vl-shimmer
        5s ease-in-out infinite;

      pointer-events: none;
    }


    @keyframes vl-shimmer {

      0% {
        left: -120%;
      }

      35% {
        left: 140%;
      }

      100% {
        left: 140%;
      }

    }


    /* =========================================================
       ICON
       ========================================================= */

    .vl-icon {

      position: relative;

      z-index: 2;

      flex:
        0 0
        clamp(38px, 9vw, 46px);

      width:
        clamp(38px, 9vw, 46px);

      height:
        clamp(38px, 9vw, 46px);

      display: flex;

      align-items: center;
      justify-content: center;

      margin-right:
        clamp(11px, 3vw, 15px);

      background: #303747;

      border-radius:
        clamp(10px, 2.5vw, 13px);

      color: #ffffff;

      font-size:
        clamp(15px, 3.8vw, 18px);

      line-height: 1;

      transition:
        transform .18s ease,
        background .18s ease,
        box-shadow .18s ease;
    }


    .vl-icon.play {

      padding-left: 2px;
    }


    .vl-icon.alt {

      font-size:
        clamp(16px, 4vw, 19px);
    }


    .vl-card:hover .vl-icon {

      transform:
        scale(1.06);

      background: #363e50;
    }


    .vl-card.red:hover .vl-icon {

      box-shadow:
        0 0 16px
        rgba(233,30,69,.16);
    }


    .vl-card.blue:hover .vl-icon {

      box-shadow:
        0 0 16px
        rgba(65,105,225,.16);
    }


    .vl-card.purple:hover .vl-icon {

      box-shadow:
        0 0 16px
        rgba(139,61,255,.16);
    }


    /* =========================================================
       CONTENT
       ========================================================= */

    .vl-content {

      position: relative;

      z-index: 2;

      flex:
        1 1 auto;

      min-width: 0;

      overflow: hidden;
    }


    /* =========================================================
       NAME ROW
       ========================================================= */

    .vl-name-row {

      display: flex;

      align-items: center;

      min-width: 0;

      margin:
        0 0
        4px;
    }


    /* =========================================================
       NAME
       ========================================================= */

    .vl-name {

      display: block;

      min-width: 0;

      color: #ffffff;

      /*
       * Tulisan dibuat lebih besar
       */

      font-size:
        clamp(15px, 4vw, 18px);

      font-weight: 700;

      line-height:
        clamp(19px, 4.8vw, 23px);

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    /* =========================================================
       BADGE
       ========================================================= */

    .vl-badge {

      flex:
        0 0 auto;

      margin-left:
        clamp(6px, 1.8vw, 9px);

      padding:
        clamp(3px, .8vw, 4px)
        clamp(6px, 1.5vw, 8px);

      border-radius:
        clamp(5px, 1.2vw, 7px);

      font-size:
        clamp(8px, 2vw, 10px);

      font-weight: 800;

      letter-spacing: .5px;

      line-height:
        clamp(11px, 2.5vw, 13px);
    }


    /* =========================================================
       MAIN BADGE
       ========================================================= */

    .main-badge {

      color: #65e6a5;

      background:
        rgba(72,213,151,.12);

      border:
        1px solid
        rgba(72,213,151,.28);

      text-shadow:
        0 0 6px
        rgba(72,213,151,.25);
    }


    /* =========================================================
       UNAVAILABLE BADGE
       ========================================================= */

    .unavailable-badge {

      color: #ff7183;

      background:
        rgba(233,30,69,.10);

      border:
        1px solid
        rgba(233,30,69,.24);

      text-shadow:
        0 0 6px
        rgba(233,30,69,.20);
    }


    /* =========================================================
       DESCRIPTION
       ========================================================= */

    .vl-description {

      display: block;

      color: #aeb5c5;

      font-size:
        clamp(12px, 3vw, 14px);

      font-weight: 400;

      line-height:
        clamp(17px, 3.8vw, 20px);

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    /* =========================================================
       STATUS
       ========================================================= */

    .vl-status {

      display: flex;

      align-items: center;

      margin-top: 3px;

      color: #7f899d;

      font-size:
        clamp(10px, 2.5vw, 12px);

      line-height:
        clamp(14px, 3vw, 16px);
    }


    /* =========================================================
       STATUS DOT
       ========================================================= */

    .vl-status-dot {

      width:
        clamp(5px, 1.2vw, 6px);

      height:
        clamp(5px, 1.2vw, 6px);

      flex:
        0 0
        clamp(5px, 1.2vw, 6px);

      margin-right: 6px;

      background: #48d597;

      border-radius: 50%;

      box-shadow:
        0 0 8px
        rgba(72,213,151,.55);
    }


    /* =========================================================
       UNAVAILABLE STATUS
       ========================================================= */

    .vl-card.unavailable .vl-status {

      color: #ed6678;
    }


    .vl-card.unavailable .vl-status-dot {

      background: #e91e45;

      box-shadow:
        0 0 8px
        rgba(233,30,69,.55);

      animation:
        vl-unavailable-pulse
        2s ease-in-out infinite;
    }


    @keyframes vl-unavailable-pulse {

      0%,
      100% {

        opacity: .65;

        box-shadow:
          0 0 5px
          rgba(233,30,69,.35);
      }

      50% {

        opacity: 1;

        box-shadow:
          0 0 10px
          rgba(233,30,69,.65);
      }

    }


    /* =========================================================
       ARROW
       ========================================================= */

    .vl-arrow {

      position: relative;

      z-index: 2;

      flex:
        0 0 auto;

      margin-left:
        clamp(7px, 2vw, 13px);

      color: #8d96a8;

      font-size:
        clamp(24px, 5vw, 30px);

      font-weight: 300;

      line-height: 1;

      transition:
        transform .18s ease,
        color .18s ease;
    }


    .vl-card:hover .vl-arrow {

      transform:
        translateX(4px);

      color: #ffffff;
    }


    /* =========================================================
       FOOTER
       ========================================================= */

    .vl-footer {

      margin-top:
        clamp(15px, 3vw, 20px);

      text-align: center;

      color: #687389;

      font-size:
        clamp(10px, 2.4vw, 12px);

      line-height: 17px;

      letter-spacing: .2px;
    }


    /* =========================================================
       TEXT SAFETY
       ========================================================= */

    .vl-title,
    .vl-count,
    .vl-name,
    .vl-description {

      overflow: hidden;

      text-overflow: ellipsis;
    }


    /* =========================================================
       REDUCED MOTION
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      .vl-card,
      .vl-icon,
      .vl-arrow {

        transition: none;
      }


      .vl-card.main-link::after,
      .vl-card.unavailable .vl-status-dot {

        animation: none;
      }

    }

  </style>

</head>


<body>


  <!-- =======================================================
       PAGE
       ======================================================= -->

  <main class="vl-page">


    <div class="vl-wrapper">


      <!-- =====================================================
           IMAGE / POSTER

           GANTI LINK GAMBAR DI src

           Ukuran:
           - Mobile: sekitar 88% lebar container
           - Maksimal: 350px
           - Selalu center
           ===================================================== -->

      <div class="vl-image-box">

        <img
          class="vl-image"
          src="https://cdn.aceimg.com/PSqYXQOti.png"
          alt="Video Preview"
          loading="eager"
        >

      </div>


      <!-- =====================================================
           HEADER
           ===================================================== -->

      <header class="vl-header">


        <div class="vl-title">

          VIDEO LINKS

        </div>


        <div class="vl-count">

          <span class="vl-count-dot">
            ●
          </span>

          2 LINKS AVAILABLE

        </div>


      </header>


      <!-- =====================================================
           VIDEO 1 - MAIN

           GANTI LINK DI href
           ===================================================== -->

      <a
        class="vl-card red main-link"
        href="https://example.com/video1"
        target="_blank"
        rel="noopener noreferrer"
      >


        <span class="vl-icon play">
          ▶
        </span>


        <span class="vl-content">


          <span class="vl-name-row">


            <span class="vl-name">
              Video 1
            </span>


            <span class="vl-badge main-badge">
              MAIN
            </span>


          </span>


          <span class="vl-description">
            Open the main video link
          </span>


          <span class="vl-status">


            <span class="vl-status-dot"></span>

            Available


          </span>


        </span>


        <span class="vl-arrow">
          ›
        </span>


      </a>


      <!-- =====================================================
           VIDEO 2 - UNAVAILABLE

           Tetap bisa diklik.
           Hanya status tampilannya unavailable.
           ===================================================== -->

      <a
        class="vl-card blue unavailable"
        href="https://example.com/video2"
        target="_blank"
        rel="noopener noreferrer"
      >


        <span class="vl-icon play">
          ▶
        </span>


        <span class="vl-content">


          <span class="vl-name-row">


            <span class="vl-name">
              Video 2
            </span>


            <span class="vl-badge unavailable-badge">
              UNAVAILABLE
            </span>


          </span>


          <span class="vl-description">
            This video is currently unavailable
          </span>


          <span class="vl-status">


            <span class="vl-status-dot"></span>

            Unavailable


          </span>


        </span>


        <span class="vl-arrow">
          ›
        </span>


      </a>


      <!-- =====================================================
           ALTERNATIVE LINK

           GANTI LINK DI href
           ===================================================== -->

      <a
        class="vl-card purple"
        href="https://example.com/alternative"
        target="_blank"
        rel="noopener noreferrer"
      >


        <span class="vl-icon alt">
          🎬
        </span>


        <span class="vl-content">


          <span class="vl-name-row">


            <span class="vl-name">
              Alternative Link
            </span>


          </span>


          <span class="vl-description">
            Use this if the main links are unavailable
          </span>


          <span class="vl-status">


            <span class="vl-status-dot"></span>

            Backup Available


          </span>


        </span>


        <span class="vl-arrow">
          ›
        </span>


      </a>


      <!-- =====================================================
           FOOTER
           ===================================================== -->

      <div class="vl-footer">

        Select a video link above

      </div>


    </div>


  </main>


</body>
</html>
