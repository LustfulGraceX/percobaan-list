<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#111725">

<title>Video Links</title>


<style>

/* =========================================================
   VIDEO LINKS - MOBILE FOCUSED
   GITHUB PAGES
   ========================================================= */


/* =========================================================
   GLOBAL RESET
   ========================================================= */

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  min-height: 100%;
  margin: 0;
  padding: 0;
  background: #111725;
}

body {
  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color: #ffffff;
}


/* =========================================================
   PAGE
   ========================================================= */

.vl-page {

  width: 100%;
  min-height: 100vh;

  display: flex;

  justify-content: center;
  align-items: center;

  padding: 20px 12px;

  background:
    radial-gradient(
      circle at 50% 12%,
      rgba(92,111,255,.08),
      transparent 35%
    ),
    #111725;
}


/* =========================================================
   MAIN WRAPPER
   ========================================================= */

.vl-wrapper {

  width: 100%;

  max-width: 620px;

  margin: 0 auto;
}


/* =========================================================
   IMAGE
   ========================================================= */

.vl-image-box {

  position: relative;

  width: 58%;

  max-width: 360px;

  margin: 0 auto 18px auto;

  overflow: hidden;

  border-radius: 14px;

  background: #1f2533;

  border: 1px solid #3a4353;

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.20);
}


.vl-image {

  display: block;

  width: 100%;
  height: auto;

  margin: 0;
  padding: 0;

  object-fit: contain;
}


/* =========================================================
   IMAGE OVERLAY
   ========================================================= */

.vl-image-box::after {

  content: "";

  position: absolute;

  inset: 0;

  pointer-events: none;

  background:
    linear-gradient(
      to bottom,
      transparent 70%,
      rgba(17,23,37,.10)
    );
}


/* =========================================================
   HEADER
   ========================================================= */

.vl-header {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 10px;

  margin-bottom: 12px;

  padding: 0 3px;
}


/* =========================================================
   TITLE
   ========================================================= */

.vl-title {

  display: flex;

  align-items: center;

  gap: 8px;

  color: #c0c7d6;

  font-size: clamp(15px, 4vw, 19px);

  font-weight: 800;

  letter-spacing: .8px;

  line-height: 1.2;
}


.vl-title::before {

  content: "";

  width: 7px;
  height: 7px;

  flex: 0 0 7px;

  background: #5c6fff;

  border-radius: 50%;

  box-shadow:
    0 0 9px
    rgba(92,111,255,.60);
}


/* =========================================================
   LINK COUNTER
   ========================================================= */

.vl-count {

  flex: 0 0 auto;

  color: #8b95a9;

  font-size: clamp(11px, 3vw, 14px);

  font-weight: 700;

  letter-spacing: .2px;

  white-space: nowrap;
}


.vl-count-dot {

  color: #48d597;

  margin-right: 4px;

  text-shadow:
    0 0 7px
    rgba(72,213,151,.6);
}


/* =========================================================
   CARD
   ========================================================= */

.vl-card {

  position: relative;

  display: flex;

  align-items: center;

  width: 100%;

  min-height: 82px;

  margin-bottom: 12px;

  padding: 11px 13px;

  background: #1f2533;

  border: 1px solid #3a4353;

  border-radius: 16px;

  color: #ffffff;

  text-decoration: none;

  overflow: hidden;

  transition:
    transform .18s ease,
    background .18s ease,
    border-color .18s ease,
    box-shadow .18s ease;
}


/* =========================================================
   HOVER
   ========================================================= */

.vl-card:hover {

  transform: translateY(-2px);

  background: #252c3a;

  border-color: #4a5568;
}


.vl-card:active {

  transform: translateY(0);
}


/* =========================================================
   LEFT COLOR LINE
   ========================================================= */

.vl-card.red {

  border-left:
    4px solid
    #e91e45;
}


.vl-card.blue {

  border-left:
    4px solid
    #4169e1;
}


.vl-card.purple {

  border-left:
    4px solid
    #8b3dff;
}


/* =========================================================
   HOVER GLOW
   ========================================================= */

.vl-card.red:hover {

  box-shadow:
    0 8px 25px
    rgba(233,30,69,.12);
}


.vl-card.blue:hover {

  box-shadow:
    0 8px 25px
    rgba(65,105,225,.12);
}


.vl-card.purple:hover {

  box-shadow:
    0 8px 25px
    rgba(139,61,255,.12);
}


/* =========================================================
   MAIN SHIMMER
   ========================================================= */

.vl-card.main-link::after {

  content: "";

  position: absolute;

  top: 0;
  left: -120%;

  width: 70%;
  height: 100%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.035),
      transparent
    );

  transform: skewX(-18deg);

  animation:
    vl-shimmer
    5s ease-in-out infinite;

  pointer-events: none;
}


@keyframes vl-shimmer {

  0% {
    left: -120%;
  }

  35% {
    left: 140%;
  }

  100% {
    left: 140%;
  }
}


/* =========================================================
   ICON
   ========================================================= */

.vl-icon {

  position: relative;

  z-index: 2;

  flex:
    0 0 44px;

  width: 44px;
  height: 44px;

  display: flex;

  align-items: center;
  justify-content: center;

  margin-right: 13px;

  background: #303747;

  border-radius: 12px;

  color: #ffffff;

  font-size: 18px;

  line-height: 1;

  transition:
    transform .18s ease,
    background .18s ease,
    box-shadow .18s ease;
}


.vl-icon.play {

  padding-left: 2px;
}


.vl-icon.alt {

  font-size: 19px;
}


/* =========================================================
   ICON HOVER
   ========================================================= */

.vl-card:hover .vl-icon {

  transform: scale(1.06);

  background: #363e50;
}


.vl-card.red:hover .vl-icon {

  box-shadow:
    0 0 15px
    rgba(233,30,69,.18);
}


.vl-card.blue:hover .vl-icon {

  box-shadow:
    0 0 15px
    rgba(65,105,225,.18);
}


.vl-card.purple:hover .vl-icon {

  box-shadow:
    0 0 15px
    rgba(139,61,255,.18);
}


/* =========================================================
   CONTENT
   ========================================================= */

.vl-content {

  position: relative;

  z-index: 2;

  flex: 1 1 auto;

  min-width: 0;

  overflow: hidden;
}


/* =========================================================
   NAME ROW
   ========================================================= */

.vl-name-row {

  display: flex;

  align-items: center;

  min-width: 0;

  margin-bottom: 4px;
}


/* =========================================================
   NAME
   ========================================================= */

.vl-name {

  display: block;

  min-width: 0;

  color: #ffffff;

  font-size: clamp(18px, 5vw, 23px);

  font-weight: 800;

  line-height: 1.15;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}


/* =========================================================
   BADGE
   ========================================================= */

.vl-badge {

  flex: 0 0 auto;

  margin-left: 8px;

  padding: 3px 7px;

  border-radius: 6px;

  font-size: clamp(9px, 2.5vw, 11px);

  font-weight: 800;

  letter-spacing: .5px;

  line-height: 12px;
}


/* =========================================================
   MAIN BADGE
   ========================================================= */

.main-badge {

  color: #65e6a5;

  background:
    rgba(72,213,151,.12);

  border:
    1px solid
    rgba(72,213,151,.28);

  text-shadow:
    0 0 6px
    rgba(72,213,151,.25);
}


/* =========================================================
   UNAVAILABLE BADGE
   ========================================================= */

.unavailable-badge {

  color: #ff7183;

  background:
    rgba(233,30,69,.10);

  border:
    1px solid
    rgba(233,30,69,.24);

  text-shadow:
    0 0 6px
    rgba(233,30,69,.20);
}


/* =========================================================
   DESCRIPTION
   ========================================================= */

.vl-description {

  display: block;

  color: #b2bac9;

  font-size: clamp(13px, 3.7vw, 16px);

  font-weight: 400;

  line-height: 1.3;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}


/* =========================================================
   STATUS
   ========================================================= */

.vl-status {

  display: flex;

  align-items: center;

  margin-top: 3px;

  color: #7f899d;

  font-size: clamp(11px, 3vw, 13px);

  line-height: 1.3;
}


/* =========================================================
   STATUS DOT
   ========================================================= */

.vl-status-dot {

  width: 6px;
  height: 6px;

  flex: 0 0 6px;

  margin-right: 6px;

  background: #48d597;

  border-radius: 50%;

  box-shadow:
    0 0 7px
    rgba(72,213,151,.55);
}


/* =========================================================
   UNAVAILABLE
   ========================================================= */

.vl-card.unavailable .vl-status {

  color: #ed6678;
}


.vl-card.unavailable .vl-status-dot {

  background: #e91e45;

  box-shadow:
    0 0 7px
    rgba(233,30,69,.55);

  animation:
    vl-unavailable-pulse
    2s ease-in-out infinite;
}


@keyframes vl-unavailable-pulse {

  0%,
  100% {

    opacity: .65;

    box-shadow:
      0 0 5px
      rgba(233,30,69,.35);
  }

  50% {

    opacity: 1;

    box-shadow:
      0 0 9px
      rgba(233,30,69,.65);
  }
}


/* =========================================================
   ARROW
   ========================================================= */

.vl-arrow {

  position: relative;

  z-index: 2;

  flex: 0 0 auto;

  margin-left: 10px;

  color: #929bad;

  font-size: 31px;

  font-weight: 300;

  line-height: 1;

  transition:
    transform .18s ease,
    color .18s ease;
}


.vl-card:hover .vl-arrow {

  transform:
    translateX(4px);

  color: #ffffff;
}


/* =========================================================
   FOOTER
   ========================================================= */

.vl-footer {

  margin-top: 18px;

  text-align: center;

  color: #69748a;

  font-size: clamp(10px, 2.8vw, 13px);

  line-height: 16px;

  letter-spacing: .2px;
}


/* =========================================================
   VERY NARROW SCREEN
   Tetap responsive tanpa breakpoint device
   ========================================================= */

@media (max-width: 390px) {

  .vl-page {

    padding-left: 10px;
    padding-right: 10px;
  }

  .vl-image-box {

    width: 48%;

    max-width: 280px;

    margin-bottom: 16px;
  }

  .vl-card {

    min-height: 80px;

    padding:
      10px
      11px;
  }

  .vl-icon {

    flex-basis: 42px;

    width: 42px;
    height: 42px;

    margin-right: 11px;

    border-radius: 11px;
  }

  .vl-name {

    font-size: 18px;
  }

  .vl-description {

    font-size: 13px;
  }

  .vl-status {

    font-size: 11px;
  }

  .vl-arrow {

    font-size: 29px;

    margin-left: 7px;
  }
}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

  .vl-card,
  .vl-icon,
  .vl-arrow {

    transition: none;
  }

  .vl-card.main-link::after,
  .vl-card.unavailable .vl-status-dot {

    animation: none;
  }
}

</style>

</head>


<body>


<main class="vl-page">

  <div class="vl-wrapper">


    <!-- =====================================================

</body>
</html>
