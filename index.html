<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#111725"
  >

  <title>Video Links</title>


  <style>

    /* =========================================================
       VIDEO LINKS - GITHUB PAGES
       FULL RESPONSIVE - NO DEVICE BREAKPOINT
       ========================================================= */


    /* =========================================================
       GLOBAL RESET
       ========================================================= */

    * {
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      min-height: 100%;

      margin: 0;
      padding: 0;

      background: #111725;
    }


    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #ffffff;

      -webkit-font-smoothing: antialiased;
    }


    /* =========================================================
       PAGE
       ========================================================= */

    .vl-page {

      width: 100%;
      min-height: 100vh;

      display: flex;

      align-items: center;
      justify-content: center;

      padding:
        clamp(18px, 4vw, 35px)
        clamp(10px, 4vw, 25px);

      background:

        radial-gradient(
          circle at 50% 15%,
          rgba(92,111,255,.08),
          transparent 35%
        ),

        #111725;
    }


    /* =========================================================
       MAIN WRAPPER
       ========================================================= */

    .vl-wrapper {

      width: 100%;

      max-width: 680px;

      margin: 0 auto;
    }


    /* =========================================================
       IMAGE / POSTER
       ========================================================= */

    .vl-image-box {

      position: relative;

      width: 100%;

      /*
       * Batasi ukuran gambar agar tidak terlalu besar.
       * Tetap responsive pada semua device.
       */

      max-width: 480px;

      margin:
        0 auto
        clamp(14px, 2.5vw, 20px);

      overflow: hidden;

      border-radius:
        clamp(12px, 2vw, 18px);

      background: #1f2533;

      border:
        1px solid
        #3a4353;

      box-shadow:
        0 12px 35px
        rgba(0,0,0,.20);
    }


    .vl-image {

      display: block;

      width: 100%;
      height: auto;

      margin: 0;
      padding: 0;

      object-fit: contain;
    }


    /* =========================================================
       IMAGE OVERLAY
       ========================================================= */

    .vl-image-box::after {

      content: "";

      position: absolute;

      inset: 0;

      pointer-events: none;

      background:

        linear-gradient(
          to bottom,
          transparent 65%,
          rgba(17,23,37,.12)
        );
    }


    /* =========================================================
       HEADER
       ========================================================= */

    .vl-header {

      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      width: 100%;

      margin:
        0 0
        clamp(9px, 2vw, 12px);

      padding:
        0 3px;
    }


    /* =========================================================
       TITLE
       ========================================================= */

    .vl-title {

      display: flex;

      align-items: center;

      gap: 8px;

      min-width: 0;

      color: #aeb5c5;

      font-size:
        clamp(11px, 1.8vw, 13px);

      font-weight: 700;

      letter-spacing:
        clamp(.6px, .15vw, 1px);

      line-height: 18px;
    }


    .vl-title::before {

      content: "";

      width: 6px;
      height: 6px;

      flex:
        0 0 6px;

      background: #5c6fff;

      border-radius: 50%;

      box-shadow:
        0 0 8px
        rgba(92,111,255,.55);
    }


    /* =========================================================
       LINK COUNTER
       ========================================================= */

    .vl-count {

      flex:
        0 0 auto;

      color: #7f899d;

      font-size:
        clamp(9px, 1.6vw, 11px);

      font-weight: 600;

      letter-spacing: .3px;

      white-space: nowrap;
    }


    .vl-count-dot {

      color: #48d597;

      margin-right: 4px;

      text-shadow:
        0 0 7px
        rgba(72,213,151,.6);
    }


    /* =========================================================
       CARD
       ========================================================= */

    .vl-card {

      position: relative;

      display: flex;

      align-items: center;

      width: 100%;

      min-height:
        clamp(66px, 10vw, 76px);

      margin:
        0 0
        clamp(9px, 1.8vw, 12px);

      padding:
        clamp(8px, 1.8vw, 10px)
        clamp(10px, 2.5vw, 16px)
        clamp(8px, 1.8vw, 10px)
        clamp(11px, 2.8vw, 18px);

      background: #1f2533;

      border:
        1px solid
        #3a4353;

      border-radius:
        clamp(12px, 2vw, 16px);

      color: #ffffff;

      text-decoration: none;

      overflow: hidden;

      transition:
        transform .18s ease,
        background .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;
    }


    /* =========================================================
       HOVER
       ========================================================= */

    .vl-card:hover {

      transform:
        translateY(-2px);

      background: #252c3a;

      border-color: #4a5568;
    }


    .vl-card:active {

      transform:
        translateY(0);
    }


    /* =========================================================
       COLOR LINE
       ========================================================= */

    .vl-card.red {

      border-left:
        4px solid
        #e91e45;
    }


    .vl-card.blue {

      border-left:
        4px solid
        #4169e1;
    }


    .vl-card.purple {

      border-left:
        4px solid
        #8b3dff;
    }


    /* =========================================================
       HOVER GLOW
       ========================================================= */

    .vl-card.red:hover {

      box-shadow:
        0 8px 25px
        rgba(233,30,69,.10);
    }


    .vl-card.blue:hover {

      box-shadow:
        0 8px 25px
        rgba(65,105,225,.10);
    }


    .vl-card.purple:hover {

      box-shadow:
        0 8px 25px
        rgba(139,61,255,.10);
    }


    /* =========================================================
       MAIN SHIMMER
       ========================================================= */

    .vl-card.main-link::after {

      content: "";

      position: absolute;

      top: 0;
      left: -120%;

      width: 70%;
      height: 100%;

      background:

        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.035),
          transparent
        );

      transform:
        skewX(-18deg);

      animation:
        vl-shimmer
        5s ease-in-out infinite;

      pointer-events: none;
    }


    @keyframes vl-shimmer {

      0% {
        left: -120%;
      }

      35% {
        left: 140%;
      }

      100% {
        left: 140%;
      }

    }


    /* =========================================================
       ICON
       ========================================================= */

    .vl-icon {

      position: relative;

      z-index: 2;

      flex:
        0 0
        clamp(34px, 6vw, 40px);

      width:
        clamp(34px, 6vw, 40px);

      height:
        clamp(34px, 6vw, 40px);

      display: flex;

      align-items: center;
      justify-content: center;

      margin-right:
        clamp(9px, 2vw, 14px);

      background: #303747;

      border-radius:
        clamp(9px, 1.8vw, 12px);

      color: #ffffff;

      font-size:
        clamp(13px, 2.5vw, 16px);

      line-height: 1;

      transition:
        transform .18s ease,
        background .18s ease,
        box-shadow .18s ease;
    }


    .vl-icon.play {

      padding-left: 2px;
    }


    .vl-icon.alt {

      font-size:
        clamp(14px, 2.7vw, 17px);
    }


    .vl-card:hover .vl-icon {

      transform:
        scale(1.06);

      background: #363e50;
    }


    .vl-card.red:hover .vl-icon {

      box-shadow:
        0 0 15px
        rgba(233,30,69,.15);
    }


    .vl-card.blue:hover .vl-icon {

      box-shadow:
        0 0 15px
        rgba(65,105,225,.15);
    }


    .vl-card.purple:hover .vl-icon {

      box-shadow:
        0 0 15px
        rgba(139,61,255,.15);
    }


    /* =========================================================
       CONTENT
       ========================================================= */

    .vl-content {

      position: relative;

      z-index: 2;

      flex:
        1 1 auto;

      min-width: 0;

      overflow: hidden;
    }


    /* =========================================================
       NAME ROW
       ========================================================= */

    .vl-name-row {

      display: flex;

      align-items: center;

      min-width: 0;

      margin:
        0 0
        3px;
    }


    /* =========================================================
       NAME
       ========================================================= */

    .vl-name {

      display: block;

      min-width: 0;

      color: #ffffff;

      font-size:
        clamp(13px, 2.4vw, 16px);

      font-weight: 700;

      line-height:
        clamp(17px, 3vw, 20px);

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    /* =========================================================
       BADGE
       ========================================================= */

    .vl-badge {

      flex:
        0 0 auto;

      margin-left:
        clamp(5px, 1.5vw, 8px);

      padding:
        clamp(2px, .5vw, 3px)
        clamp(5px, 1vw, 7px);

      border-radius:
        clamp(5px, 1vw, 6px);

      font-size:
        clamp(7px, 1.4vw, 9px);

      font-weight: 800;

      letter-spacing: .5px;

      line-height:
        clamp(10px, 2vw, 12px);
    }


    /* =========================================================
       MAIN BADGE
       ========================================================= */

    .main-badge {

      color: #65e6a5;

      background:
        rgba(72,213,151,.12);

      border:
        1px solid
        rgba(72,213,151,.28);

      text-shadow:
        0 0 6px
        rgba(72,213,151,.25);
    }


    /* =========================================================
       UNAVAILABLE BADGE
       ========================================================= */

    .unavailable-badge {

      color: #ff7183;

      background:
        rgba(233,30,69,.10);

      border:
        1px solid
        rgba(233,30,69,.24);

      text-shadow:
        0 0 6px
        rgba(233,30,69,.20);
    }


    /* =========================================================
       DESCRIPTION
       ========================================================= */

    .vl-description {

      display: block;

      color: #aeb5c5;

      font-size:
        clamp(10px, 2vw, 13px);

      font-weight: 400;

      line-height:
        clamp(15px, 2.7vw, 18px);

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    /* =========================================================
       STATUS
       ========================================================= */

    .vl-status {

      display: flex;

      align-items: center;

      margin-top: 2px;

      color: #758096;

      font-size:
        clamp(8px, 1.6vw, 10px);

      line-height:
        clamp(12px, 2.5vw, 14px);
    }


    /* =========================================================
       STATUS DOT
       ========================================================= */

    .vl-status-dot {

      width:
        clamp(4px, .8vw, 5px);

      height:
        clamp(4px, .8vw, 5px);

      flex:
        0 0
        clamp(4px, .8vw, 5px);

      margin-right: 5px;

      background: #48d597;

      border-radius: 50%;

      box-shadow:
        0 0 7px
        rgba(72,213,151,.55);
    }


    /* =========================================================
       UNAVAILABLE
       ========================================================= */

    .vl-card.unavailable .vl-status {

      color: #ed6678;
    }


    .vl-card.unavailable .vl-status-dot {

      background: #e91e45;

      box-shadow:
        0 0 7px
        rgba(233,30,69,.55);

      animation:
        vl-unavailable-pulse
        2s ease-in-out infinite;
    }


    @keyframes vl-unavailable-pulse {

      0%,
      100% {

        opacity: .65;

        box-shadow:
          0 0 5px
          rgba(233,30,69,.35);
      }

      50% {

        opacity: 1;

        box-shadow:
          0 0 9px
          rgba(233,30,69,.65);
      }

    }


    /* =========================================================
       ARROW
       ========================================================= */

    .vl-arrow {

      position: relative;

      z-index: 2;

      flex:
        0 0 auto;

      margin-left:
        clamp(6px, 2vw, 12px);

      color: #8d96a8;

      font-size:
        clamp(21px, 4vw, 27px);

      font-weight: 300;

      line-height: 1;

      transition:
        transform .18s ease,
        color .18s ease;
    }


    .vl-card:hover .vl-arrow {

      transform:
        translateX(4px);

      color: #ffffff;
    }


    /* =========================================================
       FOOTER
       ========================================================= */

    .vl-footer {

      margin-top:
        clamp(13px, 2.5vw, 18px);

      text-align: center;

      color: #626d82;

      font-size:
        clamp(8px, 1.6vw, 10px);

      line-height: 16px;

      letter-spacing: .2px;
    }


    /* =========================================================
       SMALL SCREEN OPTIMIZATION
       Tetap bukan breakpoint device.
       Hanya memastikan teks panjang tidak merusak layout.
       ========================================================= */

    .vl-title,
    .vl-count,
    .vl-name,
    .vl-description {

      overflow: hidden;

      text-overflow: ellipsis;
    }


    /* =========================================================
       REDUCED MOTION
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      .vl-card,
      .vl-icon,
      .vl-arrow {

        transition: none;
      }


      .vl-card.main-link::after,
      .vl-card.unavailable .vl-status-dot {

        animation: none;
      }

    }

  </style>

</head>


<body>


  <!-- =======================================================
       FULL PAGE
       ======================================================= -->

  <main class="vl-page">


    <div class="vl-wrapper">


      <!-- =====================================================
           IMAGE / POSTER

           GANTI GAMBAR DI src

           Ukuran otomatis:
           - Tidak memenuhi seluruh layar
           - Maksimal 480px
           - Tetap responsive
           - Selalu berada di tengah
           ===================================================== -->

      <div class="vl-image-box">

        <img
          class="vl-image"
          src="https://cdn.aceimg.com/PSqYXQOti.png"
          alt="Video Preview"
          loading="eager"
        >

      </div>


      <!-- =====================================================
           HEADER
           ===================================================== -->

      <header class="vl-header">

        <div class="vl-title">
          VIDEO LINKS
        </div>


        <div class="vl-count">

          <span class="vl-count-dot">
            ●
          </span>

          2 LINKS AVAILABLE

        </div>

      </header>


      <!-- =====================================================
           VIDEO 1 - MAIN
           GANTI LINK DI href
           ===================================================== -->

      <a
        class="vl-card red main-link"
        href="https://example.com/video1"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="vl-icon play">
          ▶
        </span>


        <span class="vl-content">


          <span class="vl-name-row">

            <span class="vl-name">
              Video 1
            </span>


            <span class="vl-badge main-badge">
              MAIN
            </span>

          </span>


          <span class="vl-description">
            Open the main video link
          </span>


          <span class="vl-status">

            <span class="vl-status-dot"></span>

            Available

          </span>


        </span>


        <span class="vl-arrow">
          ›
        </span>

      </a>


      <!-- =====================================================
           VIDEO 2 - UNAVAILABLE

           Tetap bisa diklik.
           Hanya status/tampilannya unavailable.
           ===================================================== -->

      <a
        class="vl-card blue unavailable"
        href="https://example.com/video2"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="vl-icon play">
          ▶
        </span>


        <span class="vl-content">


          <span class="vl-name-row">

            <span class="vl-name">
              Video 2
            </span>


            <span class="vl-badge unavailable-badge">
              UNAVAILABLE
            </span>

          </span>


          <span class="vl-description">
            This video is currently unavailable
          </span>


          <span class="vl-status">

            <span class="vl-status-dot"></span>

            Unavailable

          </span>


        </span>


        <span class="vl-arrow">
          ›
        </span>

      </a>


      <!-- =====================================================
           ALTERNATIVE LINK
           GANTI LINK DI href
           ===================================================== -->

      <a
        class="vl-card purple"
        href="https://example.com/alternative"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="vl-icon alt">
          🎬
        </span>


        <span class="vl-content">


          <span class="vl-name-row">

            <span class="vl-name">
              Alternative Link
            </span>

          </span>


          <span class="vl-description">
            Use this if the main links are unavailable
          </span>


          <span class="vl-status">

            <span class="vl-status-dot"></span>

            Backup Available

          </span>


        </span>


        <span class="vl-arrow">
          ›
        </span>

      </a>


      <!-- =====================================================
           FOOTER
           ===================================================== -->

      <div class="vl-footer">

        Select a video link above

      </div>


    </div>

  </main>


</body>
</html>
